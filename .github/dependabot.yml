# Keeps dependencies current and their known-vulnerability window short.
# CI's `npm audit --audit-level=high` gate still has final say on whether
# an update is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # CodeMirror ships as many small packages that only work together
      # at matching versions — update them as one PR, not ten.
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
