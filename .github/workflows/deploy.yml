# Deploys the production build to GitHub Pages on every push to main.
#
# One-time repository setup: Settings → Pages → Source → "GitHub Actions".
# The site is served from the custom domain openpad.m9rcy.dev (see
# public/CNAME, copied to dist/CNAME by Vite), so the build runs with no
# VITE_BASE override — base defaults to '/' (read in vite.config.ts),
# correct for a domain root rather than a GitHub Pages repo subpath.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; later pushes supersede queued ones.
concurrency:
  group: pages
  cancel-in-progress: true

# Opt into Node.js 24 for all actions to avoid the Node.js 20 deprecation warnings.
# Remove this once the action authors release Node.js 24 native versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enables Pages on first run if it isn't already turned on.
          # Without this, the deploy step fails with "Not Found" if Pages was never activated.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
